slug: ai-secret-scan
title: Scan Every Change for Secrets
type: practice
difficulty: intermediate
description: A generated file can carry a value that was in the context. Write the scan that
  catches it before the commit lands.
requirements:
  - File ~/review/secret-scan.sh exists
  - The script inspects the staged changes
  - The script looks for access keys and private keys
  - The script fails the run when it finds one
environment: ubuntu:24.04
validation:
  - validator: file_exists
    path: /home/learner/review/secret-scan.sh
    label: ~/review/secret-scan.sh
  - validator: file_contains
    path: /home/learner/review/secret-scan.sh
    value: "git diff"
    label: staged changes inspected
  - validator: file_contains
    path: /home/learner/review/secret-scan.sh
    value: AKIA
    label: access key pattern checked
  - validator: file_contains
    path: /home/learner/review/secret-scan.sh
    value: "PRIVATE KEY"
    label: private key pattern checked
  - validator: file_contains
    path: /home/learner/review/secret-scan.sh
    value: "exit 1"
    label: fails the run
steps:
  - title: Create the review directory
    detail: The guardrails live with the review rules.
    command: mkdir -p ~/review
  - title: Write the scan
    detail: "Look at what is staged, not at the whole repository - that is what you are about to
      commit."
    command: >-
      echo '#!/usr/bin/env bash\nset -euo pipefail\ngit diff --cached --name-only\nif grep -rqE "AKIA[0-9A-Z]{16}" . ; then\n  echo "access key found in the change"\n  exit 1\nfi\nif grep -rq "PRIVATE KEY" . ; then\n  echo "private key found in the change"\n  exit 1\nfi\necho "no secrets found"' > ~/review/secret-scan.sh
  - title: Make it executable
    detail: chmod 700 and it is ready to run as a pre-commit hook.
    command: chmod 700 ~/review/secret-scan.sh
  - title: Verify and submit
    detail: cat the script, then submit for validation.
    command: cat ~/review/secret-scan.sh
