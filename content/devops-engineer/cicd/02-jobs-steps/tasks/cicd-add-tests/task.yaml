slug: cicd-add-tests
title: Run Tests in the Pipeline
type: practice
difficulty: beginner
description: A pipeline that only checks out code proves nothing. Extend the workflow so it installs
  dependencies and runs the test suite on every push.
requirements:
  - The workflow runs on ubuntu-latest
  - The workflow contains a test step running pytest
environment: ubuntu:24.04
validation:
  - validator: file_contains
    path: /home/learner/project/.github/workflows/ci.yml
    value: pytest
    label: workflow runs pytest
  - validator: file_contains
    path: /home/learner/project/.github/workflows/ci.yml
    value: pip install
    label: workflow installs dependencies
steps:
  - title: Review the current workflow
    detail: You're extending the file from the previous task.
    command: cat ~/project/.github/workflows/ci.yml
  - title: Set up Python
    detail: "Actions with uses: are reusable steps from the marketplace. actions/setup-python@v5
      installs the Python toolchain on the runner."
    command: "echo '      - uses: actions/setup-python@v5' >> ~/project/.github/workflows/ci.yml"
  - title: Install dependencies
    detail: "Steps with run: execute shell commands on the runner. Dependencies first, so tests can
      import their libraries."
    command: "echo '      - run: pip install -r requirements.txt' >> ~/project/.github/workflows/ci.yml"
  - title: Run the tests
    detail: pytest exits non-zero when tests fail — and a non-zero exit fails the step, which fails the
      job, which fails the workflow. That's the entire CI contract.
    command: "echo '      - run: pytest' >> ~/project/.github/workflows/ci.yml"
  - title: Verify and submit
    detail: cat the file to review the final workflow, then submit.
    command: cat ~/project/.github/workflows/ci.yml
