slug: docker-run-app
title: Deploy the Application as a Container
type: challenge
difficulty: intermediate
description: A simple HTTP application image (app:latest) is already pulled on this machine. Deploy
  it as a container so it is reachable on port 8080. The walkthrough shows the exact commands and
  what every flag does.
requirements:
  - A container built from app:latest is running
  - Port 8080 is exposed and mapped
  - The application answers with HTTP 200
environment: docker:24
validation:
  - validator: container_running
    image: app:latest
    label: container from app:latest running
  - validator: port_mapped
    port: 8080
    label: port 8080 mapped
steps:
  - title: Confirm the image is available
    detail: docker images lists every image stored locally. You should see app with the tag latest —
      that's the application you need to deploy.
    command: docker images
  - title: Run the container
    detail: "docker run starts a container from an image. -d runs it detached (in the background) and
      prints the container ID. -p 8080:80 publishes ports: host 8080 forwards to the container's
      port 80, where the app listens. The order is host:container."
    command: docker run -d -p 8080:80 app:latest
  - title: Verify the container is running
    detail: docker ps lists running containers. Check STATUS is Up and PORTS shows 0.0.0.0:8080->80/tcp.
      If your container is missing, run docker ps -a — it lists stopped ones too, which usually
      means the app crashed on start.
    command: docker ps
  - title: Inspect the application logs
    detail: docker logs prints everything the process wrote to stdout — with no argument it uses the
      latest container (in a real shell you pass the container ID). You should see 'listening on
      0.0.0.0:80'.
    command: docker logs
  - title: Submit for validation
    detail: "The validator inspects container state and port mappings: a running container from
      app:latest with port 8080 mapped."
