slug: linux-log-pipeline
title: Count Errors in a Log
type: guided
difficulty: beginner
description: The application log at /var/log/app/app-2026-09-27.log is full of noise. Use grep and
  pipes to count the ERROR lines and save the result.
requirements:
  - Directory ~/report exists
  - File ~/report/error-count.txt exists and contains the number of ERROR lines
environment: ubuntu:24.04
validation:
  - validator: directory_exists
    path: /home/learner/report
    label: ~/report
  - validator: file_exists
    path: /home/learner/report/error-count.txt
    label: ~/report/error-count.txt
  - validator: file_contains
    path: /home/learner/report/error-count.txt
    value: "ERROR lines: 3"
    label: "error-count.txt says 'ERROR lines: 3'"
steps:
  - title: Look at the log
    detail: "cat dumps the whole file. Real logs are too big for this — but it's worth seeing the shape
      of the data once: one event per line, level first (INFO/WARN/ERROR)."
    command: cat /var/log/app/app-2026-09-27.log
  - title: Filter the ERROR lines
    detail: grep prints every line matching a pattern. Run it once to see the three ERROR lines.
    command: grep ERROR /var/log/app/app-2026-09-27.log
  - title: Count them with a pipe
    detail: The | (pipe) sends the output of one command into the next. grep finds the lines, wc -l
      counts them. This chain is the single most-used pattern on a Unix box.
    command: grep ERROR /var/log/app/app-2026-09-27.log | wc -l
  - title: Save the result
    detail: Write a labeled result to the report file with echo and a redirect. The pipe can't be inside
      echo, so run the count first, then write the answer you saw (3).
    command: "echo 'ERROR lines: 3' > ~/report/error-count.txt"
  - title: Create the report directory first if needed
    detail: The > redirect creates files but not parent directories. If step 4 complained, create
      ~/report and repeat step 4.
    command: mkdir ~/report
  - title: Verify and submit
    detail: cat the file to confirm, then submit for validation.
    command: cat ~/report/error-count.txt
