slug: git-add-remote
title: Connect to a Remote
type: guided
difficulty: beginner
description: Local commits are only half the story. Add GitHub as a remote and push your branch. In
  this lab the push is simulated — the workflow is identical to the real thing.
requirements:
  - Remote 'origin' points at a github.com URL
  - Branch pushed to the remote
environment: ubuntu:24.04 + git
validation:
  - validator: git_repo
    path: /home/learner/project
    label: ~/project is a Git repository
  - validator: git_remote
    path: /home/learner/project
    url: github.com
    label: origin remote points at github.com
steps:
  - title: Recreate the repository
    detail: Every lab starts from a fresh shell — ~/project doesn't exist yet. mkdir makes it.
    command: mkdir ~/project
  - title: Enter the repository
    detail: Remotes are stored per repository inside .git/config.
    command: cd ~/project
  - title: Initialize with one commit
    detail: A push needs committed work. git init, then give the repository a base commit.
    command: git init
  - title: Create a file to push
    detail: A README is enough — the point of this lab is the remote, not the content.
    command: touch README.md
  - title: Stage and commit
    detail: Stage everything, then record the 'init' commit on main.
    command: git add .
  - title: Commit
    detail: Now there is a commit on main that the later push will upload.
    command: git commit -m "init"
  - title: Add the remote
    detail: git remote add origin <url> stores the URL under the name 'origin' — the conventional name
      for the repository you cloned from or push to. On GitHub, create an empty repo first and copy
      its URL.
    command: git remote add origin https://github.com/learner/demo.git
  - title: Verify the remote
    detail: git remote -v lists every remote with its fetch and push URLs. Both should show your
      github.com URL.
    command: git remote -v
  - title: Push
    detail: git push uploads committed work. -u sets upstream tracking so future pushes can be a bare
      'git push'.
    command: git push -u origin main
  - title: Submit for validation
    detail: The validator checks that origin points at github.com.
