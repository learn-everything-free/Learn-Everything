name: Content CI

on:
  pull_request:
    paths:
      - "content/**"
      - "velite.config.ts"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails fast on any task.yaml/topic.yaml/skill.yaml that violates the
      # Zod schema, references an unregistered validator, or has bad params.
      - run: pnpm validate:content
